# Nova (a Hermes agent) + Mission Control in containers.
#
#   ./docker/setup.sh                    first time: writes .env (token, password)
#   docker compose run --rm nova setup   first time: set up Nova (model, API keys, chat platforms)
#   docker compose up -d                 start everything
#   docker compose ps                    what's running and healthy
#   docker compose logs -f nova
#
# Services:
#   nova            the agent: Hermes's messaging gateway (official nousresearch/hermes-agent image).
#                   Its data (config, keys, conversations, cron jobs) is in the nova-data volume.
#   nova-collector  reads Nova's database read-only and reports to the hub. Shares the nova
#                   container's process list so it can see whether the gateway runs.
#   hmc-hub         the dashboard, published on HMC_PUBLISH (localhost by default; setup.sh
#                   puts it on your tailnet with "tailscale serve")
#   hmc-docker      the container monitor: state, health, restarts, CPU, memory of every
#                   container, read through docker-proxy
#   docker-proxy    read-only window onto the Docker API (containers + version, GET only),
#                   so nothing else gets the Docker socket
#
# Networks:
#   agents      the agents' network, with internet access (LLM APIs, Telegram, ...)
#   hmc         hub <-> collectors, internal: no internet
#   docker-api  monitor <-> proxy, internal: no internet
#   edge        only for publishing the hub's port
#
# Another agent: copy the nova + nova-collector blocks under a new name (say "atlas"),
# change every "nova" in them to "atlas" (container names, hostname, pid: "service:atlas",
# HMC_SOURCE, the hmc.source labels, the atlas-data volume), and add atlas-data under
# volumes: at the bottom. Then: docker compose run --rm atlas setup && docker compose up -d.
# The dashboard gets an agent picker, and the Containers tab groups its containers.

name: hermes-mission-control

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-hardened: &hardened
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: *logging

services:
  nova:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    container_name: nova
    command: ["gateway", "run"]
    hostname: nova
    restart: unless-stopped
    # The image starts as root, sets up /opt/data, then runs Hermes as its own
    # "hermes" user (uid 10000 unless HERMES_UID says otherwise).
    environment:
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
    volumes:
      - ${NOVA_DATA:-nova-data}:/opt/data
    networks: [agents]
    labels:
      hmc.source: nova
      hmc.role: agent
    logging: *logging

  hmc-hub:
    image: hermes-mission-control:local
    build: .
    container_name: hmc-hub
    command: ["python3", "/app/hub/hub.py"]
    restart: unless-stopped
    environment:
      HMC_BIND: 0.0.0.0
      HMC_PORT: "8788"
      HMC_TOKEN: ${HMC_TOKEN:?run ./docker/setup.sh first}
      HMC_VIEW_PASSWORD_HASH: ${HMC_VIEW_PASSWORD_HASH:-}
      HMC_GARAGE_URL: ${HMC_GARAGE_URL:-}
    volumes:
      - hmc-data:/data
    ports:
      - "${HMC_PUBLISH:-127.0.0.1:8788}:8788"
    networks: [hmc, edge]
    healthcheck:
      test: ["CMD", "python3", "/app/docker/healthcheck.py", "hub"]
      interval: 30s
      timeout: 5s
      start_period: 10s
    mem_limit: 128m
    labels:
      hmc.role: hub
    <<: *hardened

  nova-collector:
    image: hermes-mission-control:local
    build: .
    container_name: nova-collector
    command: ["python3", "/app/collector/collector.py"]
    restart: unless-stopped
    # Hermes's user inside the nova container: the only one that can read its files,
    # and the owner of the gateway process.
    user: "${HERMES_UID:-10000}:${HERMES_GID:-10000}"
    # See the nova container's processes (to tell whether the gateway runs) and
    # use the same host name, so Hermes's heartbeat rows count as "this machine".
    pid: "service:nova"
    hostname: nova
    environment:
      HMC_HUB_URL: http://hmc-hub:8788
      HMC_TOKEN: ${HMC_TOKEN:?run ./docker/setup.sh first}
      HMC_DB: /hermes/state.db
      HMC_SOURCE: nova
      HMC_INTERVAL: "5"
      HMC_IDLE_INTERVAL: ${HMC_IDLE_INTERVAL:-60}
      HMC_SHOW_TEXT: ${HMC_SHOW_TEXT:-1}
      HMC_HEALTH_FILE: /tmp/hmc-ok
    volumes:
      - ${NOVA_DATA:-nova-data}:/hermes:ro
    networks: [hmc]
    depends_on: [nova, hmc-hub]
    healthcheck:
      test: ["CMD", "python3", "/app/docker/healthcheck.py", "file", "/tmp/hmc-ok", "180"]
      interval: 30s
      timeout: 5s
      start_period: 30s
    mem_limit: 192m
    cpus: 0.5
    labels:
      hmc.source: nova
      hmc.role: collector
    <<: *hardened

  hmc-docker:
    image: hermes-mission-control:local
    build: .
    container_name: hmc-docker
    command: ["python3", "/app/collector/docker_monitor.py"]
    restart: unless-stopped
    environment:
      HMC_HUB_URL: http://hmc-hub:8788
      HMC_TOKEN: ${HMC_TOKEN:?run ./docker/setup.sh first}
      HMC_SOURCE: docker
      HMC_DOCKER_URL: tcp://docker-proxy:2375
      HMC_DOCKER_ALL: ${HMC_DOCKER_ALL:-1}
      HMC_DOCKER_PROJECT: hermes-mission-control
      HMC_INTERVAL: "5"
      HMC_IDLE_INTERVAL: ${HMC_IDLE_INTERVAL:-60}
      HMC_SHOW_TEXT: ${HMC_SHOW_TEXT:-1}
      HMC_HEALTH_FILE: /tmp/hmc-ok
    networks: [hmc, docker-api]
    depends_on: [hmc-hub, docker-proxy]
    healthcheck:
      test: ["CMD", "python3", "/app/docker/healthcheck.py", "file", "/tmp/hmc-ok", "180"]
      interval: 30s
      timeout: 5s
      start_period: 30s
    mem_limit: 96m
    cpus: 0.25
    labels:
      hmc.role: monitor
    <<: *hardened

  docker-proxy:
    image: tecnativa/docker-socket-proxy:3.4
    container_name: hmc-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"   # list/inspect/stats containers
      VERSION: "1"
      PING: "1"
      POST: "0"         # GET only: can't start, stop or change anything
      EVENTS: "0"
      DISABLE_IPV6: "1" # the internal network is IPv4 only
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]
    read_only: true
    tmpfs: [/run, /tmp]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    labels:
      hmc.role: proxy
    logging: *logging

volumes:
  hmc-data:
  nova-data:

networks:
  agents: {}
  hmc:
    internal: true
  docker-api:
    internal: true
  edge: {}
